services:
  # Main CollabCanvas Web & Real-Time Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collabcanvas-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/collabcanvas?schema=public
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL Database (Prisma ORM backend)
  postgres:
    image: postgres:16-alpine
    container_name: collabcanvas-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collabcanvas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Pub/Sub & Session Cache)
  redis:
    image: redis:7-alpine
    container_name: collabcanvas-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
